<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Catalog — Clinova Healthcare</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/tables.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
  <link rel="stylesheet" href="../../assets/css/glass.css">
</head>
<body>
  <div class="app" id="app"></div>
  <script type="module">
    import { initShell, getPageContent } from '../../components/app-shell.js';
    import { DataTable, Format, Modal } from '../../components/ui.js';
    import { formatReferenceRange, laboratory } from '../../api/laboratory.js';

    let catTable;

    initShell(['LAB_TECH', 'ADMIN'], () => {
      const page = getPageContent();
      
      page.innerHTML = `
        <div class="page-header">
          <div class="page-header__info">
            <h1 class="text-page-title">Test Catalog</h1>
            <p class="text-caption">Read-only reference of available laboratory tests and parameters.</p>
          </div>
        </div>

        <div class="card">
          <div class="card__header" style="padding: var(--sp-3) var(--sp-4);">
            <div class="search-bar" style="max-width: 300px; margin: 0;">
              <span class="search-bar__icon"><svg class="icon icon--sm" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-search"></use></svg></span>
              <input type="text" class="search-bar__input" id="cat-search" placeholder="Search tests...">
            </div>
          </div>
          <div id="cat-table"></div>
        </div>
      `;

      const columns = [
        { key: 'code', label: 'Code', sortable: true, render: r => `<strong>${r.code}</strong>` },
        { key: 'name', label: 'Test Name', sortable: true, render: r => `<strong>${r.name}</strong><br><span class="text-caption">${r.category}</span>` },
        { key: 'price', label: 'Price', sortable: true, render: r => Format.money(r.price) },
        { key: 'parameters', label: 'Parameters', sortable: false, render: r => r.parameters.length + ' param(s)' },
        { key: 'actions', label: '', width: '100px', render: r => `<button class="btn btn--secondary btn--sm btn-view" data-id="${r.id}">View Details</button>` }
      ];

      catTable = new DataTable('cat-table', columns, laboratory.getCatalog(), { searchInputId: 'cat-search', defaultSort: 'name' });
      catTable.sortAsc = true;
      catTable.render();

      document.getElementById('cat-table').addEventListener('click', (e) => {
        const viewBtn = e.target.closest('.btn-view');
        if (viewBtn) {
          const test = laboratory.getCatalog().find(t => t.id === viewBtn.dataset.id);
          
          const content = `
            <div style="margin-bottom:var(--sp-4);">
              <div><strong>Category:</strong> ${test.category}</div>
              <div><strong>Price:</strong> ${Format.money(test.price)}</div>
            </div>
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="padding:var(--sp-2); text-align:left;">Parameter</th>
                  <th style="padding:var(--sp-2); text-align:left;">Unit</th>
                  <th style="padding:var(--sp-2); text-align:left;">Reference Range</th>
                </tr>
              </thead>
              <tbody>
                ${test.parameters.map(p => `
                  <tr>
                    <td style="padding:var(--sp-2); border-top:1px solid var(--border);">${p.name}</td>
                    <td style="padding:var(--sp-2); border-top:1px solid var(--border);">${p.unit}</td>
                    <td style="padding:var(--sp-2); border-top:1px solid var(--border);" class="text-caption">${formatReferenceRange(p, false)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
          `;
          Modal.show({ title: `${test.name} (${test.code})`, content, size: 'md' });
        }
      });
    });
  </script>
</body>
</html>

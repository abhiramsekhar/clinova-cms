<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Queue — Clinova Healthcare</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/tables.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
  <link rel="stylesheet" href="../../assets/css/glass.css">
</head>
<body>
  <div class="app" id="app"></div>
  <script type="module">
    import { initShell, getPageContent } from '../../components/app-shell.js';
    import { DataTable, Format, Badge, Modal, Toast } from '../../components/ui.js';
    import { formatReferenceRange, laboratory } from '../../api/laboratory.js';
    import { db } from '../../data/db.js';

    let qTable;
    let currentUser;

    const PRIORITY_SCORE = { 'Stat': 3, 'Urgent': 2, 'Routine': 1 };

    initShell(['LAB_TECH', 'ADMIN'], (session) => {
      currentUser = session;
      const page = getPageContent();
      
      page.innerHTML = `
        <div class="page-header">
          <div class="page-header__info">
            <h1 class="text-page-title">Test Queue</h1>
          </div>
        </div>

        <div class="card" style="margin-bottom: var(--sp-6);">
          <div class="card__header" style="padding: var(--sp-3) var(--sp-4);">
            <div class="search-bar" style="max-width: 300px; margin: 0;">
              <span class="search-bar__icon"><svg class="icon icon--sm" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-search"></use></svg></span>
              <input type="text" class="search-bar__input" id="q-search" placeholder="Search patient...">
            </div>
          </div>
          <div id="q-table"></div>
        </div>
      `;

      const columns = [
        { key: 'priority', label: 'Priority', width: '100px', sortable: true, render: r => Badge.priority(r.priority) },
        { key: 'createdAt', label: 'Ordered', sortable: true, render: r => Format.time(r.createdAt.split('T')[1].slice(0,5)) },
        { key: 'patientId', label: 'Patient', sortable: true, render: r => `<strong>${db.getById('patients', r.patientId).name}</strong>` },
        { key: 'testId', label: 'Test', sortable: true, render: r => db.getById('labCatalog', r.testId).name },
        { key: 'doctorId', label: 'Ordering Dr.', sortable: true, render: r => db.getById('staff', r.doctorId).name },
        { key: 'status', label: 'Status', sortable: true, render: r => Badge.status(r.status) },
        { key: 'actions', label: '', width: '160px', render: r => {
          if (r.status === 'ORDERED') return `<button class="btn btn--secondary btn--sm btn-action" data-id="${r.id}" data-action="SAMPLE_COLLECTED">Collect Sample</button>`;
          if (r.status === 'SAMPLE_COLLECTED') return `<button class="btn btn--primary btn--sm btn-action" data-id="${r.id}" data-action="PROCESSING">Start Processing</button>`;
          if (r.status === 'PROCESSING') return `<button class="btn btn--primary btn--sm btn-result" data-id="${r.id}">Enter Result</button>`;
          return '';
        }}
      ];

      qTable = new DataTable('q-table', columns, [], { searchInputId: 'q-search' });
      loadQueue();

      document.getElementById('q-table').addEventListener('click', (e) => {
        const actionBtn = e.target.closest('.btn-action');
        if (actionBtn) {
          try {
            laboratory.updateStatus(actionBtn.dataset.id, actionBtn.dataset.action, currentUser.staffId);
            Toast.show('Status updated.');
            loadQueue();
          } catch(err) { Toast.show(err.message, 'error'); }
          return;
        }

        const resultBtn = e.target.closest('.btn-result');
        if (resultBtn) return showResultEntry(resultBtn.dataset.id);
      });
    });

    function loadQueue() {
      // Get all pending orders (not completed/cancelled)
      const orders = db.getAll('labOrders').filter(o => o.status !== 'COMPLETED' && o.status !== 'CANCELLED');
      
      // Sort: Priority (Stat > Urgent > Routine), then Oldest First
      orders.sort((a, b) => {
        const pDiff = PRIORITY_SCORE[b.priority] - PRIORITY_SCORE[a.priority];
        if (pDiff !== 0) return pDiff;
        return a.createdAt.localeCompare(b.createdAt);
      });

      qTable.updateData(orders);
    }

    function showResultEntry(id) {
      const order = db.getById('labOrders', id);
      const test = db.getById('labCatalog', order.testId);
      const patient = db.getById('patients', order.patientId);

      const content = `
        <div style="margin-bottom:var(--sp-4);">
          <div class="text-caption">Patient</div>
          <div class="text-body"><strong>${patient.name}</strong> (${patient.mrn})</div>
        </div>
        <form id="result-form">
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th style="padding:var(--sp-2); text-align:left;">Parameter</th>
                <th style="padding:var(--sp-2); text-align:left;">Result Value</th>
                <th style="padding:var(--sp-2); text-align:left;">Reference Range</th>
              </tr>
            </thead>
            <tbody>
              ${test.parameters.map(p => `
                <tr>
                  <td style="padding:var(--sp-2); border-top:1px solid var(--border);"><strong>${p.name}</strong></td>
                  <td style="padding:var(--sp-2); border-top:1px solid var(--border);">
                    <div style="display:flex;align-items:center;gap:8px;">
                      <input type="number" step="0.01" class="form-input" name="${p.name}" required style="width:100px;">
                      <span class="text-caption">${p.unit}</span>
                    </div>
                  </td>
                  <td style="padding:var(--sp-2); border-top:1px solid var(--border); font-size:0.875rem;">
                    ${formatReferenceRange(p)}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
          <div class="allergy-banner" style="margin-top:var(--sp-4);background:var(--warning-light);color:var(--warning-dark);">
            <svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-alert-triangle"></use></svg>
            <div>Completing this will lock the result and notify the doctor if values are critical.</div>
          </div>
        </form>
      `;

      const actions = `
        <button class="btn btn--secondary" id="res-cancel">Cancel</button>
        <button class="btn btn--primary" id="res-submit" form="result-form">Complete Result</button>
      `;

      const m = Modal.show({ title: `Enter Results: ${test.name}`, content, size: 'lg', actions });
      document.getElementById('res-cancel').addEventListener('click', m.close);
      
      document.getElementById('result-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const f = e.target;
        if (!f.checkValidity()) return f.reportValidity();

        const data = {};
        test.parameters.forEach(p => {
          data[p.name] = f[p.name].value;
        });

        Modal.confirm({
          title: 'Confirm Results',
          message: 'Are you sure you want to finalize and lock these results?',
          confirmText: 'Finalize & Lock',
          onConfirm: () => {
            try {
              const result = laboratory.enterResult(id, data, currentUser.staffId);
              if (result.isCritical) {
                const doctor = db.getById('staff', result.doctorId);
                Toast.show(`Critical result finalized and sent to ${doctor.name}.`, 'error');
                window.dispatchEvent(new Event('clinova:notifications-updated'));
              } else {
                Toast.show('Results finalized successfully.');
              }
              m.close();
              loadQueue();
            } catch(err) { Toast.show(err.message, 'error'); }
          }
        });
      });
    }
  </script>
</body>
</html>

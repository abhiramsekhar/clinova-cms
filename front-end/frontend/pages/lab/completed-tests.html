<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Completed Tests — Clinova Healthcare</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/tables.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
  <link rel="stylesheet" href="../../assets/css/glass.css">
</head>
<body>
  <div class="app" id="app"></div>
  <script type="module">
    import { initShell, getPageContent } from '../../components/app-shell.js';
    import { DataTable, Format, Badge } from '../../components/ui.js';
    import { db } from '../../data/db.js';

    let doneTable;

    initShell(['LAB_TECH', 'ADMIN'], () => {
      const page = getPageContent();
      page.innerHTML = `
        <div class="page-header">
          <div class="page-header__info">
            <h1 class="text-page-title">Completed Tests</h1>
          </div>
        </div>

        <div class="card">
          <div class="card__header" style="padding: var(--sp-3) var(--sp-4);">
            <div class="search-bar" style="max-width: 300px; margin: 0;">
              <span class="search-bar__icon"><svg class="icon icon--sm" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-search"></use></svg></span>
              <input type="text" class="search-bar__input" id="done-search" placeholder="Search patient...">
            </div>
          </div>
          <div id="done-table"></div>
        </div>
      `;

      const columns = [
        { key: 'completedAt', label: 'Completed', sortable: true, render: r => Format.datetime(r.completedAt) },
        { key: 'patientId', label: 'Patient', sortable: true, render: r => `<strong>${db.getById('patients', r.patientId).name}</strong>` },
        { key: 'testId', label: 'Test', sortable: true, render: r => db.getById('labCatalog', r.testId).name },
        { key: 'tat', label: 'TAT (Mins)', sortable: false, render: r => {
          const start = new Date(r.createdAt);
          const end = new Date(r.completedAt);
          return Math.round((end - start) / 60000);
        }},
        { key: 'isCritical', label: 'Flag', sortable: true, render: r => r.isCritical ? `<span class="badge badge--danger">CRITICAL</span>` : '-' },
        { key: 'actions', label: '', width: '100px', render: r => `<a href="results.html?id=${r.id}" class="btn btn--secondary btn--sm">View Report</a>` }
      ];

      doneTable = new DataTable('done-table', columns, [], { searchInputId: 'done-search', defaultSort: 'completedAt' });
      doneTable.sortAsc = false;
      
      const orders = db.getAll('labOrders').filter(o => o.status === 'COMPLETED');
      doneTable.updateData(orders);
    });
  </script>
</body>
</html>

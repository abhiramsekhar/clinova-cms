<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports — Clinova Healthcare</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/tables.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
  <link rel="stylesheet" href="../../assets/css/glass.css">
</head>
<body>
  <div class="app" id="app"></div>
  <script type="module">
    import { initShell, getPageContent } from '../../components/app-shell.js';
    import { reports } from '../../api/reports.js';
    import { Toast } from '../../components/ui.js';

    initShell(['ADMIN'], () => {
      const page = getPageContent();
      const today = new Date().toISOString().split('T')[0];
      const lastMonth = new Date(new Date().setMonth(new Date().getMonth() - 1)).toISOString().split('T')[0];

      page.innerHTML = `
        <div class="page-header">
          <div class="page-header__info">
            <h1 class="text-page-title">Generate Reports</h1>
            <p class="text-caption">Export clinical and financial data as CSV.</p>
          </div>
        </div>

        <div class="card" style="max-width: 600px;">
          <div class="card__body">
            <form id="report-form" class="form-grid">
              <div class="form-group" style="grid-column: span 2;">
                <label class="form-label">Report Type</label>
                <select class="form-select" name="type" required>
                  <option value="appointments">Appointments by Department</option>
                  <option value="revenue">Revenue by Day</option>
                  <option value="outstanding">Outstanding Balances</option>
                  <option value="medicines">Medicine Consumption</option>
                  <option value="lab">Lab Volume & Turnaround</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Start Date</label>
                <input type="date" class="form-input" name="startDate" value="${lastMonth}">
              </div>
              <div class="form-group">
                <label class="form-label">End Date</label>
                <input type="date" class="form-input" name="endDate" value="${today}">
              </div>
              <div class="form-group" style="grid-column: span 2; margin-top: var(--sp-4);">
                <button type="submit" class="btn btn--primary" style="width: 100%;">
                  <svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-download"></use></svg> Export CSV
                </button>
              </div>
            </form>
          </div>
        </div>
      `;

      document.getElementById('report-form').addEventListener('submit', e => {
        e.preventDefault();
        const f = e.target;
        const type = f.type.value;
        const start = f.startDate.value;
        const end = f.endDate.value;

        const data = reports.generateReport(type, start, end);
        if (data.length === 0) {
          Toast.show('No data found for this period.', 'warning');
          return;
        }

        const filename = `${type}_report_${start}_to_${end}.csv`;
        reports.exportCSV(filename, data);
        Toast.show('Report exported successfully.');
      });
    });
  </script>
</body>
</html>

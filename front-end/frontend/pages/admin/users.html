<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Accounts — Clinova</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/tables.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
  <link rel="stylesheet" href="../../assets/css/glass.css">
</head>
<body>
  <div class="app" id="app"></div>
  <script type="module">
    import { initShell, getPageContent } from '../../components/app-shell.js';
    import { DataTable, Modal, Toast, Format } from '../../components/ui.js';
    import { admin } from '../../api/admin.js';
    import { db } from '../../data/db.js';

    let table;

    initShell(['ADMIN'], () => {
      const page = getPageContent();
      
      page.innerHTML = `
        <div class="page-header">
          <div class="page-header__info">
            <h1 class="text-page-title">User Accounts</h1>
            <p class="text-caption">Manage login credentials and account locks independently of staff profiles.</p>
          </div>
        </div>

        <div class="card">
          <div class="card__header" style="padding: var(--sp-3) var(--sp-4);">
            <div class="search-bar" style="max-width: 300px; margin: 0;">
              <span class="search-bar__icon"><svg class="icon icon--sm" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-search"></use></svg></span>
              <input type="text" class="search-bar__input" id="usr-search" placeholder="Search users...">
            </div>
          </div>
          <div id="usr-table"></div>
        </div>
      `;

      const columns = [
        { key: 'username', label: 'Username', sortable: true, render: r => `<strong>${r.username}</strong>` },
        { key: 'staffId', label: 'Staff Member', sortable: true, render: r => {
          try {
            const staff = db.getById('staff', r.staffId);
            return staff.name;
          } catch(e) { return '-'; }
        }},
        { key: 'role', label: 'Role', sortable: true },
        { key: 'lastLogin', label: 'Last Login', sortable: true, render: r => r.lastLogin ? Format.datetime(r.lastLogin) : 'Never' },
        { key: 'status', label: 'Status', sortable: true, render: r => {
          if (!r.isActive) return `<span class="badge badge--danger">Disabled</span>`;
          if (r.lockedUntil && new Date(r.lockedUntil) > new Date()) return `<span class="badge badge--danger">Locked</span>`;
          return `<span class="badge badge--success">Active</span>`;
        }},
        { key: 'actions', label: '', width: '180px', render: r => {
          let html = `<button class="btn btn--secondary btn--sm btn-reset" data-id="${r.id}">Reset Password</button> `;
          if (r.lockedUntil && new Date(r.lockedUntil) > new Date()) {
            html += `<button class="btn btn--primary btn--sm btn-unlock" data-id="${r.id}">Unlock</button>`;
          }
          return html;
        }}
      ];

      table = new DataTable('usr-table', columns, admin.listUsers(), { searchInputId: 'usr-search', defaultSort: 'username' });

      document.getElementById('usr-table').addEventListener('click', e => {
        const id = e.target.dataset.id;
        if (e.target.closest('.btn-reset')) {
          Modal.confirm({
            title: 'Reset Password',
            message: 'Are you sure? (In a real system this sends an email link)',
            onConfirm: () => {
              admin.resetPassword(id);
              Toast.show('Password reset');
              table.updateData(admin.listUsers());
            }
          });
        }
        if (e.target.closest('.btn-unlock')) {
          admin.unlockUser(id);
          Toast.show('Account unlocked');
          table.updateData(admin.listUsers());
        }
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard — Clinova Healthcare</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/tables.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
  <link rel="stylesheet" href="../../assets/css/glass.css">
  <style>
    .bar-chart { display: flex; align-items: flex-end; gap: var(--sp-2); height: 150px; padding: var(--sp-4) 0; border-bottom: 1px solid var(--border); }
    .bar { background: var(--primary); width: 40px; border-radius: 4px 4px 0 0; transition: height 0.3s ease; position: relative; display: flex; justify-content: center; }
    .bar-label { position: absolute; bottom: -25px; font-size: 0.75rem; color: var(--muted); }
    .bar-val { position: absolute; top: -20px; font-size: 0.75rem; font-weight: bold; }
    .alert-strip { display: flex; gap: var(--sp-4); overflow-x: auto; padding-bottom: var(--sp-2); }
    .alert-item { padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-sm); font-size: 0.875rem; font-weight: 500; white-space: nowrap; }
    .alert-item.danger { background: var(--danger-light); color: var(--danger); }
    .alert-item.warning { background: var(--warning-light); color: var(--warning-dark); }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <script type="module">
    import { initShell, getPageContent } from '../../components/app-shell.js';
    import { DataTable, Format } from '../../components/ui.js';
    import { reports } from '../../api/reports.js';

    initShell(['ADMIN'], (session) => {
      const page = getPageContent();
      const stats = reports.getAdminStats();

      // Calculate max for chart
      const maxAppts = Math.max(...stats.chartData.map(d => d.count), 1);

      page.innerHTML = `
        <div class="page-header">
          <div class="page-header__info">
            <h1 class="text-page-title">Admin Dashboard</h1>
            <p class="text-caption">Welcome back, ${Format.displayName(session.staffName, session.role)}</p>
          </div>
        </div>

        <!-- Stat Cards -->
        <div class="stat-row" style="margin-bottom:var(--sp-6);">
          <div class="stat-card">
            <div class="stat-card__icon" style="background:var(--primary-light);color:var(--primary);"><svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-users"></use></svg></div>
            <div class="stat-card__value">${stats.totalStaff}</div>
            <div class="stat-card__label">Total Staff</div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon" style="background:var(--success-light);color:var(--success);"><svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-activity"></use></svg></div>
            <div class="stat-card__value">${stats.activeDoctors}</div>
            <div class="stat-card__label">Active Doctors</div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon" style="background:var(--warning-light);color:var(--warning-dark);"><svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-calendar"></use></svg></div>
            <div class="stat-card__value">${stats.todayAppointments}</div>
            <div class="stat-card__label">Today's Appointments</div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon" style="background:var(--navy-100);color:var(--navy-700);"><svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-flask"></use></svg></div>
            <div class="stat-card__value">${stats.pendingLabTests}</div>
            <div class="stat-card__label">Pending Lab Tests</div>
          </div>
        </div>

        <!-- Alert Strip -->
        ${stats.stockAlerts.length > 0 ? `
          <div style="margin-bottom:var(--sp-6);">
            <div class="text-caption" style="margin-bottom:var(--sp-2);">Pharmacy Alerts</div>
            <div class="alert-strip">
              ${stats.stockAlerts.map(a => `<div class="alert-item ${a.type}">${a.name} - ${a.issue}</div>`).join('')}
            </div>
          </div>
        ` : ''}

        <!-- Quick Actions -->
        <div style="margin-bottom:var(--sp-6);">
          <div class="text-caption" style="margin-bottom:var(--sp-2);">Quick Actions</div>
          <div style="display:flex; flex-wrap:wrap; gap:var(--sp-3);">
            <button class="btn btn--secondary" onclick="window.location.href='staff.html'"><svg class="icon"><use href="../../assets/icons/sprite.svg#icon-users"></use></svg> Manage Staff</button>
            <button class="btn btn--secondary" onclick="window.location.href='users.html'"><svg class="icon"><use href="../../assets/icons/sprite.svg#icon-user"></use></svg> Manage Users</button>
            <button class="btn btn--secondary" onclick="window.location.href='departments.html'"><svg class="icon"><use href="../../assets/icons/sprite.svg#icon-activity"></use></svg> Departments</button>
            <button class="btn btn--secondary" onclick="window.location.href='lab-catalog.html'"><svg class="icon"><use href="../../assets/icons/sprite.svg#icon-flask"></use></svg> Lab Test Catalog</button>
            <button class="btn btn--secondary" onclick="window.location.href='reports.html'"><svg class="icon"><use href="../../assets/icons/sprite.svg#icon-file-text"></use></svg> Reports</button>
            <button class="btn btn--secondary" onclick="window.location.href='settings.html'"><svg class="icon"><use href="../../assets/icons/sprite.svg#icon-settings"></use></svg> Settings</button>
          </div>
        </div>

        <div class="split">
          <!-- Main Col -->
          <div class="split__main">
            <div class="card" style="margin-bottom:var(--sp-6);">
              <div class="card__header"><span class="text-card-title">Appointments (Last 7 Days)</span></div>
              <div class="card__body">
                <div class="bar-chart" style="justify-content:space-around; margin-bottom: 20px;">
                  ${stats.chartData.map(d => {
                    const heightPct = (d.count / maxAppts) * 100;
                    return `
                      <div class="bar" style="height:${heightPct}%;">
                        <div class="bar-val">${d.count}</div>
                        <div class="bar-label">${d.label}</div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card__header"><span class="text-card-title">Department Overview</span></div>
              <div id="dept-table"></div>
            </div>
          </div>

          <!-- Side Col -->
          <div class="split__aside">
            <div class="card">
              <div class="card__header"><span class="text-card-title">Recent Activity</span></div>
              <div class="card__body" style="padding-top:0;">
                ${stats.recentActivity.length === 0 ? '<div class="text-caption">No recent activity.</div>' : ''}
                ${stats.recentActivity.map(a => `
                  <div style="border-bottom:1px solid var(--border); padding:var(--sp-3) 0;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                      <strong>${a.action}</strong>
                      <span class="text-caption">${Format.time(a.timestamp.split('T')[1].slice(0,5))}</span>
                    </div>
                    <div class="text-body-sm">${a.details}</div>
                    <div class="text-caption" style="margin-top:2px;">User ID: ${a.userId}</div>
                  </div>
                `).join('')}
                <div style="margin-top:var(--sp-3);"><a href="audit-log.html" class="text-link text-body-sm">View full audit log</a></div>
              </div>
            </div>
          </div>
        </div>
      `;

      new DataTable('dept-table', [
        { key: 'name', label: 'Department', sortable: true, render: r => `<strong>${r.name}</strong>` },
        { key: 'doctors', label: 'Doctors', sortable: true },
        { key: 'todayAppts', label: 'Today\'s Appts', sortable: true }
      ], stats.deptOverview, { defaultSort: 'name' });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Prescriptions — Clinova Healthcare</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/tables.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
  <link rel="stylesheet" href="../../assets/css/glass.css">

</head>
<body>
  <div class="app" id="app"></div>
  <script type="module">
    import { initShell, getPageContent } from '../../components/app-shell.js';
    import { DataTable, Format, Badge, Modal, Toast } from '../../components/ui.js';
    import { prescriptions } from '../../api/prescriptions.js';
    import { db } from '../../data/db.js';

    let rxTable;
    let currentUser;

    initShell(['DOCTOR'], (session) => {
      currentUser = session;
      const page = getPageContent();
      
      window.safeGet = function(collection, id) {
        if (!id) return null;
        try {
          return db.getById(collection, id);
        } catch {
          return null;
        }
      };

      window.escapeHtml = function(str) {
        if (str == null) return '';
        return String(str).replace(/[&<>"']/g, match => {
          const escapeMap = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
          return escapeMap[match];
        });
      };
      
      page.innerHTML = `
        <div class="page-header">
          <div class="page-header__info">
            <h1 class="text-page-title">My Prescriptions</h1>
          </div>
          <div class="page-header__actions">
            <button class="btn btn--primary" id="btn-new-rx">
              <svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-plus"></use></svg>
              New Prescription
            </button>
          </div>
        </div>

        <div class="card" style="margin-bottom: var(--sp-6);">
          <div class="card__header" style="padding: var(--sp-3) var(--sp-4);">
            <div class="form-group" style="margin:0;">
              <select class="form-input" id="filter-status">
                <option value="">All Statuses</option>
                <option value="PENDING">Pending</option>
                <option value="DISPENSED">Dispensed</option>
                <option value="PARTIALLY_DISPENSED">Partially Dispensed</option>
                <option value="CANCELLED">Cancelled</option>
              </select>
            </div>
            <div class="form-group" style="margin:0; margin-left:var(--sp-4);">
              <input type="text" class="form-input" id="search-rx" placeholder="Search patient or medicine...">
            </div>
          </div>
          <div id="rx-table"></div>
        </div>
      `;

      // Setup Table
      const columns = [
        { key: 'createdAt', label: 'Date', sortable: true, render: r => Format.date(r.createdAt) },
        { key: 'patientId', label: 'Patient', sortable: true, render: r => {
          const p = window.safeGet('patients', r.patientId);
          return `<strong>${window.escapeHtml(p ? p.name : 'Unknown patient')}</strong>`;
        }},
        { key: 'items', label: 'Items', sortable: false, render: r => (Array.isArray(r.items) ? r.items : []).map(i => window.escapeHtml(i.name)).join(', ') },
        { key: 'status', label: 'Status', sortable: true, render: r => Badge.status(r.status) },
        { key: 'actions', label: '', width: '130px', render: r => {
          let html = `<div class="table-actions">`;
          html += `<button class="btn btn--secondary btn--sm btn-view" data-id="${r.id}">View</button>`;
          if (r.status === 'PENDING') {
            html += `<button class="btn btn--danger btn--sm btn--icon btn-cancel" data-id="${r.id}" title="Cancel prescription" aria-label="Cancel prescription"><svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-x"></use></svg></button>`;
          }
          html += `</div>`;
          return html;
        }}
      ];

      rxTable = new DataTable('rx-table', columns, [], { 
        defaultSort: 'createdAt',
        searchInputId: 'search-rx',
        emptyTitle: 'No Prescriptions Found',
        emptyIcon: 'icon-file-text'
      });
      rxTable.sortAsc = false;
      loadRx();

      // Filters
      document.getElementById('filter-status').addEventListener('change', loadRx);
      
      // New Prescription
      document.getElementById('btn-new-rx').addEventListener('click', showNewRxModal);

      // Event Delegation
      document.getElementById('rx-table').addEventListener('click', (e) => {
        const viewBtn = e.target.closest('.btn-view');
        if (viewBtn) return showRx(viewBtn.dataset.id);
        
        const cancelBtn = e.target.closest('.btn-cancel');
        if (cancelBtn) {
          Modal.confirm({
            title: 'Cancel Prescription',
            message: 'Are you sure you want to cancel this pending prescription?',
            confirmStyle: 'danger',
            onConfirm: () => {
              prescriptions.cancel(cancelBtn.dataset.id);
              Toast.show('Prescription cancelled.');
              loadRx();
            }
          });
        }
      });
    });

    function loadRx() {
      const status = document.getElementById('filter-status').value;
      if (!currentUser || !currentUser.staffId) {
        rxTable.updateData([]);
        return;
      }
      const data = prescriptions.list(status ? { status, doctorId: currentUser.staffId } : { doctorId: currentUser.staffId });
      rxTable.updateData(data);
    }

    function showRx(id) {
      const rx = prescriptions.getById(id);
      if (!rx) return Toast.show('Prescription not found', 'error');
      
      const p = window.safeGet('patients', rx.patientId) || { name: 'Unknown patient', mrn: '-', dateOfBirth: null, gender: '-', allergies: [] };
      const doc = window.safeGet('staff', rx.doctorId) || { name: 'Unknown doctor' };
      const items = Array.isArray(rx.items) ? rx.items : [];
      
      const buildRxHtml = () => `
        <style>
          .rx-doc { font-family: system-ui, -apple-system, sans-serif; color: #1f2937; font-size: 14px; line-height: 1.5; padding: 1rem; }
          .rx-doc .rx-header { display: flex; justify-content: space-between; border-bottom: 2px solid #05668D; padding-bottom: 20px; margin-bottom: 20px; }
          .rx-doc .rx-logo { height: 48px; width: auto; margin-bottom: 8px; }
          .rx-doc .rx-hospital-name { font-size: 18px; font-weight: 600; color: #05668D; }
          .rx-doc .rx-hospital-info { font-size: 12px; color: #64748b; }
          .rx-doc .rx-title { font-size: 24px; font-weight: 700; margin: 0 0 4px 0; color: #05668D; }
          .rx-doc .rx-info-text { font-size: 12px; color: #475569; }
          .rx-doc .rx-patient-box { padding: 16px; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 20px; }
          .rx-doc .rx-patient-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
          .rx-doc .rx-patient-details { font-size: 13px; color: #475569; }
          .rx-doc .rx-allergies { color: #dc2626; font-size: 13px; margin-top: 8px; font-weight: 500; }
          .rx-doc .rx-notes { padding: 12px; background: #fffbeb; border: 1px solid #fef3c7; color: #b45309; border-radius: 6px; margin-bottom: 20px; font-size: 13px; }
          .rx-doc .rx-table { width: 100%; border-collapse: collapse; margin-bottom: 40px; }
          .rx-doc .rx-th { background: #f8fafc; font-weight: 600; text-align: left; padding: 12px; border-bottom: 2px solid #e2e8f0; font-size: 13px; color: #475569; text-transform: uppercase; }
          .rx-doc .rx-td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
          .rx-doc .rx-tr { page-break-inside: avoid; }
          .rx-doc .rx-signature-area { margin-top: 60px; text-align: right; page-break-inside: avoid; }
          .rx-doc .rx-signature-line { display: inline-block; width: 200px; border-top: 1px solid #1f2937; padding-top: 8px; font-size: 13px; }
          .rx-doc .rx-footer { margin-top: 40px; text-align: center; font-size: 11px; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 8px; }
          @media print {
            @page { size: A4; margin: 14mm; }
            body { margin: 0; padding: 0; background: white; }
            .rx-doc { padding: 0; }
            .rx-doc .rx-footer { position: static; bottom: 0; left: 0; width: 100%; background: white; }
          }
        </style>
        <div class="rx-doc" id="print-area">
          <div class="rx-header">
            <div>
              <img src="${window.location.origin}${window.location.pathname.substring(0, window.location.pathname.indexOf('/pages/'))}/assets/images/logo.svg" class="rx-logo" alt="Clinova Logo" onload="window.printReady = true;" onerror="window.printReady = true;">
              <div class="rx-hospital-name">CLINOVA HEALTHCARE</div>
              <div class="rx-hospital-info">Care. Precision. Trust.</div>
              <div class="rx-hospital-info">MG Road, Ernakulam, Kerala</div>
            </div>
            <div style="text-align: right;">
              <h1 class="rx-title">PRESCRIPTION</h1>
              <div class="rx-info-text">Prescription ID: ${window.escapeHtml(rx.id)}</div>
              <div class="rx-info-text">Date: ${Format.date(rx.createdAt)}</div>
              <div class="rx-info-text">Doctor: ${window.escapeHtml(Format.displayName(doc.name, 'DOCTOR'))}</div>
            </div>
          </div>

          <div class="rx-patient-box">
            <div class="rx-patient-name">${window.escapeHtml(p.name)}</div>
            <div class="rx-patient-details">MRN: ${window.escapeHtml(p.mrn)} | ${Format.age(p.dateOfBirth)} yrs | ${window.escapeHtml(p.gender)}</div>
            ${p.allergies && p.allergies.length ? `<div class="rx-allergies">Allergies: ${window.escapeHtml(p.allergies.join(', '))}</div>` : ''}
          </div>

          ${rx.notes ? `<div class="rx-notes"><strong>Doctor's Notes:</strong><br>${window.escapeHtml(rx.notes)}</div>` : ''}

          <table class="rx-table">
            <thead>
              <tr class="rx-tr">
                <th class="rx-th">Medicine</th>
                <th class="rx-th">Dosage</th>
                <th class="rx-th">Frequency</th>
                <th class="rx-th">Duration</th>
                <th class="rx-th" style="text-align: center;">Qty</th>
              </tr>
            </thead>
            <tbody>
              ${items.map(i => `
                <tr class="rx-tr">
                  <td class="rx-td" style="font-weight: 500;">${window.escapeHtml(i.name)}</td>
                  <td class="rx-td">${window.escapeHtml(i.dosage)}</td>
                  <td class="rx-td">${window.escapeHtml(i.frequency)}</td>
                  <td class="rx-td">${window.escapeHtml(i.duration)}</td>
                  <td class="rx-td" style="text-align: center;">${window.escapeHtml(i.quantity)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <div class="rx-signature-area">
            <div class="rx-signature-line">Doctor's Signature</div>
          </div>

          <div class="rx-footer">
            Clinova Healthcare — Generated ${new Date().toLocaleString()}
          </div>
        </div>
      `;
      
      const content = buildRxHtml();

      window._printRx = function() {
        const printWindow = window.open('', '_blank');
        if (!printWindow) {
          Toast.show('Allow pop-ups to print', 'warning');
          return;
        }
        printWindow.document.write(`
          <!DOCTYPE html>
          <html>
          <head>
            <title>Prescription - ${window.escapeHtml(p.name)}</title>
          </head>
          <body` + `>
            ${buildRxHtml()}
            <script>
              let attempts = 0;
              const checkReady = () => {
                if (window.printReady || attempts > 10) {
                  window.print();
                } else {
                  attempts++;
                  setTimeout(checkReady, 50);
                }
              };
              checkReady();
            </scr` + `ipt>
          </body` + `>
          </html` + `>
        `);
        printWindow.document.close();
      };

      const actions = `
        <button class="btn btn--secondary" onclick="window._printRx()">
          <svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-printer"></use></svg>
          Print
        </button>
      `;

      Modal.show({ title: 'Prescription Details', content, size: 'lg', actions });
    }

    function showNewRxModal() {
      const allMeds = db.getAll('medicines').filter(m => m.isActive).map(m => {
        const stock = (m.batches || []).reduce((acc, b) => acc + Math.max(0, b.quantity), 0);
        let avail = 'In Stock';
        if (stock === 0) avail = 'Out of Stock';
        else if (stock <= m.reorderLevel) avail = 'Low Stock';
        return { ...m, stock, avail };
      });
      const allPatients = db.getAll('patients');
      let rxItems = [];

      const renderRxItems = () => {
        const list = document.getElementById('rx-item-list');
        if (rxItems.length === 0) {
          list.innerHTML = '<div class="text-caption">No medicines added yet.</div>';
          return;
        }
        list.innerHTML = rxItems.map((item, i) => `
          <div class="rx-item" style="display: flex; gap: var(--sp-3); padding: var(--sp-3); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: var(--sp-3); align-items: center; background: white;">
            <div class="rx-item__details" style="flex: 1;">
              <strong>${window.escapeHtml(item.name)}</strong><br>
              <span class="text-body-sm">${window.escapeHtml(item.dosage)}, ${window.escapeHtml(item.frequency)}, for ${window.escapeHtml(item.duration)} (Qty: ${window.escapeHtml(item.quantity)})</span>
              ${item.instructions ? `<br><span class="text-caption text-muted">Inst: ${window.escapeHtml(item.instructions)}</span>` : ''}
            </div>
            <button class="btn btn--danger btn--sm btn--icon btn-remove-rx" data-index="${i}" type="button" aria-label="Remove medicine">
              <svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-x"></use></svg>
            </button>
          </div>
        `).join('');
      };

      const content = `
        <div class="form-group" style="margin-bottom: var(--sp-4);">
          <label class="form-group__label">Select Patient *</label>
          <select class="form-input" id="rx-patient" required>
            <option value="">-- Select a patient --</option>
            ${allPatients.map(p => `<option value="${p.id}">${window.escapeHtml(p.name)} (${window.escapeHtml(p.mrn)})</option>`).join('')}
          </select>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:var(--sp-4);margin-bottom:var(--sp-4);">
          <div class="form-group" style="flex:1 1 100%;">
            <label class="form-group__label">Search Medicine *</label>
            <input type="text" class="form-input" id="rx-med-search" placeholder="Type to filter...">
            <select class="form-input" id="rx-med" size="4" style="margin-top: 4px; height: 120px;">
            </select>
          </div>
          <div class="form-group" style="flex:1 1 120px;">
            <label class="form-group__label">Dosage *</label>
            <input type="text" class="form-input" id="rx-dos" placeholder="e.g. 500mg">
          </div>
          <div class="form-group" style="flex:1 1 120px;">
            <label class="form-group__label">Frequency *</label>
            <input type="text" class="form-input" id="rx-freq" placeholder="e.g. 1-0-1">
          </div>
          <div class="form-group" style="flex:1 1 120px;">
            <label class="form-group__label">Duration *</label>
            <input type="text" class="form-input" id="rx-dur" placeholder="e.g. 5 days">
          </div>
          <div class="form-group" style="flex:1 1 80px;">
            <label class="form-group__label">Qty *</label>
            <input type="number" class="form-input" id="rx-qty" value="10" min="1">
          </div>
          <div class="form-group" style="flex:1 1 100%;">
            <label class="form-group__label">Instructions (Optional)</label>
            <input type="text" class="form-input" id="rx-inst" placeholder="e.g. After food">
          </div>
          <div style="display:flex;align-items:flex-end;margin-bottom:12px;flex:1 1 100%;">
            <button class="btn btn--secondary" type="button" id="rx-add-btn" style="width:100%">Add Medicine</button>
          </div>
        </div>
        <div class="panel-title" style="font-size: 0.875rem; font-weight: 600; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: var(--sp-1); margin-bottom: var(--sp-3);">Current Prescription</div>
        <div id="rx-item-list" style="max-height: 200px; overflow-y: auto;"></div>
      `;

      const actions = `
        <button class="btn btn--secondary" id="rxb-cancel">Cancel</button>
        <button class="btn btn--primary" id="rxb-submit">Issue Prescription</button>
      `;

      const m = Modal.show({ title: 'New Prescription', content, size: 'lg', actions });
      renderRxItems();
      
      const searchInput = document.getElementById('rx-med-search');
      const medSelect = document.getElementById('rx-med');
      
      const renderMedicineOptions = (query = '') => {
        const normalizedQuery = query.trim().toLowerCase();
        const filtered = allMeds.filter(med => 
          `${med.name} ${med.genericName}`.toLowerCase().includes(normalizedQuery)
        );
        medSelect.innerHTML = `
          <option value="">-- Select medicine --</option>
          ${filtered.map(m => 
            `<option value="${m.id}">${window.escapeHtml(m.name)} (${window.escapeHtml(m.genericName)}) - ${m.avail} (${m.stock})</option>`
          ).join('')}
        `;
        medSelect.value = '';
      };

      // Initial render
      renderMedicineOptions();

      searchInput.addEventListener('input', () => {
        renderMedicineOptions(searchInput.value);
      });

      document.getElementById('rxb-cancel').addEventListener('click', m.close);
      
      document.getElementById('rx-item-list').addEventListener('click', (e) => {
        const removeBtn = e.target.closest('.btn-remove-rx');
        if (removeBtn) {
          rxItems.splice(removeBtn.dataset.index, 1);
          renderRxItems();
        }
      });

      document.getElementById('rx-add-btn').addEventListener('click', () => {
        const medId = medSelect.value;
        if (!medId) {
          Toast.show('Please select a medicine.', 'error');
          return;
        }
        const dos = document.getElementById('rx-dos').value.trim();
        const freq = document.getElementById('rx-freq').value.trim();
        const dur = document.getElementById('rx-dur').value.trim();
        const qty = parseInt(document.getElementById('rx-qty').value);
        const inst = document.getElementById('rx-inst').value.trim();

        if (!dos || !freq || !dur || !qty || qty <= 0) {
          Toast.show('Please fill all required fields correctly.', 'error');
          return;
        }

        if (rxItems.some(item => String(item.medicineId) === String(medId))) {
          Toast.show('Medicine is already added.', 'error');
          return;
        }

        const med = allMeds.find(m => String(m.id) === String(medId));
        if (!med) {
          Toast.show('Selected medicine could not be found.', 'error');
          return;
        }
        if (med.stock === 0) {
          Toast.show('Warning: This medicine is out of stock in the pharmacy.', 'error');
        }

        rxItems.push({
          medicineId: medId,
          name: med.name,
          dosage: dos,
          frequency: freq,
          duration: dur,
          quantity: qty,
          instructions: inst || undefined
        });
        document.getElementById('rx-med').value = '';
        document.getElementById('rx-dos').value = '';
        document.getElementById('rx-freq').value = '';
        document.getElementById('rx-dur').value = '';
        document.getElementById('rx-qty').value = '10';
        document.getElementById('rx-inst').value = '';
        renderRxItems();
      });

      document.getElementById('rxb-submit').addEventListener('click', (e) => {
        const patientId = document.getElementById('rx-patient').value;
        if (!patientId) {
          Toast.show('Please select a patient.', 'error');
          return;
        }
        if (rxItems.length === 0) {
          Toast.show('Please add at least one medicine.', 'error');
          return;
        }
        
        const submitBtn = e.target;
        submitBtn.disabled = true;
        
        try {
          prescriptions.create({
            consultationId: null,
            patientId: patientId,
            doctorId: currentUser.staffId,
            items: rxItems,
            notes: ''
          }, false);
          Toast.show('Prescription issued.');
          m.close();
          loadRx();
        } catch (err) {
          submitBtn.disabled = false;
          if (err.code === 'ALLERGY_WARNING') {
            Modal.confirm({
              title: 'Allergy Warning',
              message: err.message,
              confirmText: 'Override & Prescribe',
              confirmStyle: 'danger',
              onConfirm: () => {
                prescriptions.create({
                  consultationId: null,
                  patientId: patientId,
                  doctorId: currentUser.staffId,
                  items: rxItems,
                  notes: ''
                }, true);
                Toast.show('Prescription issued with override.');
                m.close();
                loadRx();
              }
            });
          } else {
            Toast.show(err.message, 'error');
          }
        }
      });
    }
  </script>
</body>
</html>

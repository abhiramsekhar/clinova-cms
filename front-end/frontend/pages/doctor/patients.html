<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patients Directory — Clinova Healthcare</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/tables.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
  <link rel="stylesheet" href="../../assets/css/glass.css">
</head>
<body>
  <div class="app" id="app"></div>
  <script type="module">
    import { initShell, getPageContent } from '../../components/app-shell.js';
    import { DataTable, Format } from '../../components/ui.js';
    import { patients } from '../../api/patients.js';

    let patientTable;

    initShell(['DOCTOR', 'ADMIN'], () => {
      const page = getPageContent();
      page.innerHTML = `
        <div class="page-header">
          <div class="page-header__info">
            <h1 class="text-page-title">Patients Directory</h1>
          </div>
        </div>

        <div class="card" style="margin-bottom: var(--sp-6);">
          <div class="card__header" style="padding: var(--sp-3) var(--sp-4);">
            <div class="search-bar" style="max-width: 300px; margin: 0;">
              <span class="search-bar__icon"><svg class="icon icon--sm" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-search"></use></svg></span>
              <input type="text" class="search-bar__input" id="patient-search" placeholder="Search by name, MRN...">
            </div>
          </div>
          <div id="patients-table"></div>
        </div>
      `;

      const escapeHtml = (str) => {
        if (str == null) return '';
        return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
      };

      // Setup Table
      const columns = [
        { key: 'mrn', label: 'MRN', sortable: true, render: r => escapeHtml(r.mrn) },
        { key: 'name', label: 'Patient Name', sortable: true, render: r => `<strong>${escapeHtml(r.name)}</strong><br><span class="text-caption">${escapeHtml(r.gender)}, ${escapeHtml(String(Format.age(r.dateOfBirth)))} yrs</span>` },
        { key: 'bloodGroup', label: 'Blood Group', sortable: true, render: r => escapeHtml(r.bloodGroup) || '-' },
        { key: 'chronicConditions', label: 'Chronic Conditions', sortable: false, render: r => escapeHtml((r.chronicConditions || []).join(', ')) || '-' },
        { key: 'actions', label: '', width: '100px', render: r => `
          <a href="../shared/patient-profile.html?id=${r.id}" class="btn btn--secondary btn--sm">View Profile</a>
        `}
      ];

      patientTable = new DataTable('patients-table', columns, patients.list(), {
        searchInputId: 'patient-search',
        defaultSort: 'name'
      });
      patientTable.sortAsc = true;
      patientTable._sortData();
      patientTable.render();
    });
  </script>
</body>
</html>

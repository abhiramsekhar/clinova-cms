<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Clinova Healthcare</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/tables.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
  <link rel="stylesheet" href="../../assets/css/glass.css">
</head>
<body>
  <div class="app" id="app"></div>
  <script type="module">
    import { initShell, getPageContent } from '../../components/app-shell.js';
    import { db } from '../../data/db.js';
    import { DataTable, Format, Badge } from '../../components/ui.js';
    import { reports } from '../../api/reports.js';

    initShell(['DOCTOR'], (session) => {
      const page = getPageContent();
      
      function renderDashboard() {
        const stats = reports.getDoctorStats(session.staffId);

      page.innerHTML = `
        <div class="page-header">
          <div class="page-header__info">
            <h1 class="text-page-title">Dashboard</h1>
            <p class="text-caption">Welcome back, ${Format.displayName(session.staffName, session.role)}</p>
          </div>
          <div class="page-header__actions">
            <a href="appointments.html" class="btn btn--primary">
              <svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-users"></use></svg>
              View Schedule
            </a>
          </div>
        </div>
        
        <div class="stat-row" style="margin-bottom:var(--sp-6);">
          <div class="stat-card">
            <div class="stat-card__icon" style="background:var(--primary-light);color:var(--primary);"><svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-calendar"></use></svg></div>
            <div class="stat-card__value">${stats.pendingAppts}</div>
            <div class="stat-card__label">Pending Today</div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon" style="background:var(--success-light);color:var(--success);"><svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-check-circle"></use></svg></div>
            <div class="stat-card__value">${stats.completedAppts}</div>
            <div class="stat-card__label">Completed</div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon" style="background:var(--warning-light);color:var(--warning-dark);"><svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-flask"></use></svg></div>
            <div class="stat-card__value">${stats.pendingLabs}</div>
            <div class="stat-card__label">Pending Lab Results</div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon" style="background:var(--navy-100);color:var(--navy-700);"><svg class="icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-pill"></use></svg></div>
            <div class="stat-card__value">${stats.activeRxs}</div>
            <div class="stat-card__label">Active Prescriptions</div>
          </div>
        </div>

        <div class="dashboard-grid doctor-dashboard">
          <div class="card">
            <div class="card__header">
              <span class="text-card-title">Today's Appointments</span>
            </div>
            <div id="today-table"></div>
          </div>

          <div style="display:flex; flex-direction:column; gap:var(--sp-6);">
            <div class="card">
              <div class="card__header">
                <span class="text-card-title">Pending Lab Results</span>
              </div>
              <div class="card__body" style="padding-top:0;">
                ${stats.pendingLabsList.length === 0 ? '<div class="text-caption">No pending results.</div>' : ''}
                ${stats.pendingLabsList.slice(0, 5).map(l => {
                  const safeGet = (coll, id) => {
                    try { return db.getById(coll, id); } catch { return null; }
                  };
                  const escapeHtml = (str) => {
                    if (str == null) return '';
                    return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
                  };
                  const p = safeGet('patients', l.patientId);
                  const t = safeGet('labCatalog', l.testId);
                  const patientName = p ? escapeHtml(p.name) : 'Patient record unavailable';
                  const testName = t ? escapeHtml(t.name) : 'Test information unavailable';
                  
                  return `
                    <div style="border-bottom:1px solid var(--border); padding:var(--sp-2) 0;">
                      <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                        <strong>${patientName}</strong>
                        ${Badge.status(l.status)}
                      </div>
                      <div class="text-body-sm">${testName}</div>
                    </div>
                  `;
                }).join('')}
                ${stats.pendingLabsList.length > 5 ? `<div style="margin-top:var(--sp-2);"><a href="lab-orders.html" class="text-link text-body-sm">View all ${stats.pendingLabs}</a></div>` : ''}
              </div>
            </div>
          </div>
        </div>
      `;

      const safeGet = (coll, id) => {
        try { return db.getById(coll, id); } catch { return null; }
      };
      const escapeHtml = (str) => {
        if (str == null) return '';
        return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
      };

      // Setup Table
      const columns = [
        { key: 'tokenNumber', label: 'Token', width:'80px', sortable: true, render: r => `<strong>#${escapeHtml(r.tokenNumber)}</strong>` },
        { key: 'time', label: 'Time', width:'100px', sortable: true, render: r => escapeHtml(Format.time(r.time)) },
        { key: 'patientId', label: 'Patient', sortable: true, render: r => {
          const p = safeGet('patients', r.patientId);
          return p ? `<strong>${escapeHtml(p.name)}</strong>` : `<span style="color:var(--muted)">Patient record unavailable</span>`;
        }},
        { key: 'status', label: 'Status', sortable: true, render: r => Badge.status(r.status) },
        { key: 'actions', label: '', width: '80px', render: r => {
          if (r.status === 'CHECKED_IN' || r.status === 'IN_PROGRESS') {
            return `<a href="appointments.html" class="btn btn--primary btn--sm">Go</a>`;
          } else if (r.status === 'SCHEDULED') {
            return `<span style="color:var(--muted); font-size: 0.85em;">Awaiting check-in</span>`;
          }
          return '';
        }}
      ];

      new DataTable('today-table', columns, stats.todayApptsList, { defaultSort: 'time' });
      }
      
      renderDashboard();
      
      window.addEventListener('storage', (e) => {
        if (e.key === 'clinova.v1.appointments' || e.key === 'clinova.v1.notifications') {
          renderDashboard();
        }
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clinical History — Clinova Healthcare</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/tables.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
  <link rel="stylesheet" href="../../assets/css/glass.css">
  <style>
    .timeline { position: relative; padding-left: 20px; border-left: 2px solid var(--border); margin-left: 10px; margin-top: var(--sp-6); }
    .timeline-item { position: relative; margin-bottom: var(--sp-6); }
    .timeline-item::before {
      content: ''; position: absolute; left: -26px; top: 4px; width: 10px; height: 10px;
      border-radius: 50%; background: var(--primary); border: 2px solid white;
      box-shadow: 0 0 0 2px var(--primary-light);
    }
    .timeline-date { font-weight: 600; font-size: 0.875rem; color: var(--muted); margin-bottom: var(--sp-2); }
    .timeline-card { background: white; border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-4); }
    .timeline-type { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: var(--primary); margin-bottom: var(--sp-2); }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <script type="module">
    import { initShell, getPageContent } from '../../components/app-shell.js';
    import { Format } from '../../components/ui.js';
    import { db } from '../../data/db.js';

    initShell(['DOCTOR'], () => {
      const page = getPageContent();
      
      const patients = db.getAll('patients');

      page.innerHTML = `
        <div class="page-header">
          <div class="page-header__info">
            <h1 class="text-page-title">Clinical History Timeline</h1>
          </div>
        </div>

        <div class="card" style="margin-bottom: var(--sp-6);">
          <div class="card__body" style="display:flex; gap:var(--sp-4); flex-wrap:wrap;">
            <div class="form-group" style="flex:1; min-width:200px; margin:0;">
              <label class="form-group__label">Select Patient</label>
              <select class="form-input" id="patient-select">
                <option value="">-- Choose Patient --</option>
                ${patients.map(p => `<option value="${p.id}">${p.name} (${p.mrn})</option>`).join('')}
              </select>
            </div>
            <div class="form-group" style="flex:1; min-width:200px; margin:0;">
              <label class="form-group__label">Filter by Type</label>
              <select class="form-input" id="type-select">
                <option value="ALL">All Events</option>
                <option value="CONSULTATION">Consultations</option>
                <option value="PRESCRIPTION">Prescriptions</option>
                <option value="LAB_ORDER">Lab Orders</option>
              </select>
            </div>
          </div>
        </div>

        <div id="timeline-container">
          <div class="empty-state">
            <div class="empty-state__icon">
              <svg class="icon icon--lg" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-user"></use></svg>
            </div>
            <div class="empty-state__title">No patient selected</div>
            <div class="empty-state__text">Select a patient above to view their clinical timeline.</div>
          </div>
        </div>
      `;

      document.getElementById('patient-select').addEventListener('change', (e) => {
        if (!e.target.value) {
          document.getElementById('timeline-container').innerHTML = '';
          return;
        }
        renderTimeline();
      });

      document.getElementById('type-select').addEventListener('change', () => {
        if (document.getElementById('patient-select').value) {
          renderTimeline();
        }
      });
    });

    function renderTimeline() {
      const escapeHtml = (str) => {
        if (str == null) return '';
        return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
      };
      const safeGet = (coll, id) => {
        try { return db.getById(coll, id); } catch { return null; }
      };

      const patientId = document.getElementById('patient-select').value;
      const typeFilter = document.getElementById('type-select').value;
      const container = document.getElementById('timeline-container');
      
      // Gather all events for this patient
      let events = [];
      
      if (typeFilter === 'ALL' || typeFilter === 'CONSULTATION') {
        db.getAll('consultations').filter(c => c.patientId === patientId).forEach(c => {
          events.push({
            date: c.createdAt,
            type: 'CONSULTATION',
            data: c
          });
        });
      }

      if (typeFilter === 'ALL' || typeFilter === 'PRESCRIPTION') {
        db.getAll('prescriptions').filter(p => p.patientId === patientId).forEach(p => {
          events.push({
            date: p.createdAt,
            type: 'PRESCRIPTION',
            data: p
          });
        });
      }

      if (typeFilter === 'ALL' || typeFilter === 'LAB_ORDER') {
        db.getAll('labOrders').filter(l => l.patientId === patientId).forEach(l => {
          events.push({
            date: l.createdAt,
            type: 'LAB_ORDER',
            data: l
          });
        });
      }

      if (events.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="empty-state__title">No clinical history found for this patient.</div></div>`;
        return;
      }

      // Sort descending
      events.sort((a, b) => b.date.localeCompare(a.date));

      let html = `<div class="timeline">`;
      events.forEach(e => {
        const doc = safeGet('staff', e.data.doctorId);
        const docName = doc ? escapeHtml(doc.name) : 'Unknown Doctor';
        let contentHtml = '';
        let icon = '';

        if (e.type === 'CONSULTATION') {
          icon = 'icon-file-text';
          contentHtml = `
            <div class="text-body-sm"><strong>Diagnosis:</strong> ${escapeHtml(e.data.diagnosis) || 'None recorded'}</div>
            <div class="text-body-sm" style="margin-top:4px;"><strong>Vitals:</strong> BP ${escapeHtml(e.data.vitalSigns.bp) || '-'}, Pulse ${escapeHtml(e.data.vitalSigns.pulse) || '-'}</div>
            <div class="text-body-sm" style="margin-top:4px;">${escapeHtml(e.data.notes)}</div>
          `;
        } else if (e.type === 'PRESCRIPTION') {
          icon = 'icon-pill';
          const items = Array.isArray(e.data.items) ? e.data.items : [];
          contentHtml = `
            <ul style="padding-left:var(--sp-4); margin:0; font-size:0.875rem;">
              ${items.map(i => `<li>${escapeHtml(i.name)} - ${escapeHtml(i.dosage)} (${escapeHtml(i.duration)})</li>`).join('')}
            </ul>
          `;
        } else if (e.type === 'LAB_ORDER') {
          icon = 'icon-flask';
          const test = safeGet('labCatalog', e.data.testId);
          contentHtml = `
            <div class="text-body-sm"><strong>Test:</strong> ${escapeHtml(test ? test.name : 'Unknown')}</div>
            <div class="text-body-sm"><strong>Status:</strong> ${escapeHtml(e.data.status)}</div>
          `;
        }

        html += `
          <div class="timeline-item">
            <div class="timeline-date">${escapeHtml(Format.datetime(e.date))}</div>
            <div class="timeline-card">
              <div class="timeline-type">
                <svg class="icon icon--sm" aria-hidden="true"><use href="../../assets/icons/sprite.svg#${icon}"></use></svg>
                ${escapeHtml(e.type.replace('_', ' '))} • ${Format.displayName(docName, 'DOCTOR')}
              </div>
              <div>${contentHtml}</div>
            </div>
          </div>
        `;
      });
      html += `</div>`;
      container.innerHTML = html;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Appointments — Clinova Healthcare</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/tables.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
  <link rel="stylesheet" href="../../assets/css/glass.css">
</head>
<body>
  <div class="app" id="app"></div>
  <script type="module">
    import { initShell, getPageContent } from '../../components/app-shell.js';
    import { DataTable, Format, Badge, Toast } from '../../components/ui.js';
    import { appointments } from '../../api/appointments.js';
    import { consultations } from '../../api/consultations.js';
    import { db } from '../../data/db.js';

    let apptTable;
    let currentUser;

    initShell(['DOCTOR'], (session) => {
      currentUser = session;
      const page = getPageContent();
      const urlParams = new URLSearchParams(window.location.search);
      const today = urlParams.get('date') || new Date().toISOString().split('T')[0];

      page.innerHTML = `
        <div class="page-header">
          <div class="page-header__info">
            <h1 class="text-page-title">My Appointments</h1>
          </div>
        </div>

        <div class="card" style="margin-bottom: var(--sp-6);">
          <div class="card__header" style="padding: var(--sp-3) var(--sp-4); display:flex; gap:var(--sp-4); flex-wrap:wrap; justify-content:space-between;">
            <div class="search-bar" style="max-width: 300px; margin: 0;">
              <span class="search-bar__icon"><svg class="icon icon--sm" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-search"></use></svg></span>
              <input type="text" class="search-bar__input" id="appt-search" placeholder="Search patient...">
            </div>
            <div class="form-group" style="margin:0; display:flex; gap: 12px; align-items: center;">
              <label style="display:flex; align-items:center; gap:4px; font-size:0.9em; cursor:pointer;">
                <input type="checkbox" id="filter-upcoming"> Upcoming (7 days)
              </label>
              <input type="date" class="form-input" id="filter-date" value="${today}">
            </div>
          </div>
          <div id="appts-table"></div>
        </div>
      `;

      const safeGet = (coll, id) => {
        try { return db.getById(coll, id); } catch { return null; }
      };
      const escapeHtml = (str) => {
        if (str == null) return '';
        return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
      };

      // Setup Table
      const columns = [
        { key: 'tokenNumber', label: 'Token', width:'100px', sortable: true, render: r => {
          const unread = db.getAll('notifications').filter(n => n.targetUserId === currentUser.userId && !n.isRead && n.type === 'APPOINTMENT');
          const isNew = unread.some(n => n.link.includes(`date=${r.date}`) && (n.message.includes(`Token: ${r.tokenNumber}`) || n.title === 'Appointment Cancelled'));
          let html = `<strong>#${escapeHtml(r.tokenNumber)}</strong>`;
          if (isNew) html += ` <span class="badge badge--success badge--sm" style="margin-left:4px; font-size:10px;">New</span>`;
          return html;
        }},
        { key: 'date', label: 'Date', width:'100px', sortable: true, render: r => escapeHtml(Format.date(r.date)) },
        { key: 'time', label: 'Time', width:'100px', sortable: true, render: r => escapeHtml(Format.time(r.time)) },
        { key: 'patientId', label: 'Patient', sortable: true, render: r => {
          const p = safeGet('patients', r.patientId);
          return p ? `<strong>${escapeHtml(p.name)}</strong><br><span class="text-caption">${escapeHtml(p.mrn)}</span>` : `<span style="color:var(--muted)">Patient unavailable</span>`;
        }},
        { key: 'type', label: 'Type', sortable: true, render: r => escapeHtml(r.type) },
        { key: 'status', label: 'Status', sortable: true, render: r => Badge.status(r.status) },
        { key: 'actions', label: '', width: '150px', render: r => {
          if (r.status === 'CHECKED_IN' || r.status === 'IN_PROGRESS') {
            return `<button class="btn btn--primary btn--sm btn-consult" data-id="${r.id}">Consult</button>`;
          } else if (r.status === 'SCHEDULED') {
            return `<span style="color:var(--muted); font-size: 0.85em;">Awaiting check-in</span>`;
          } else if (r.status === 'COMPLETED') {
            const consult = db.getAll('consultations').find(c => c.appointmentId === r.id);
            if (consult) {
              return `<a href="consultation.html?id=${consult.id}" class="btn btn--secondary btn--sm">View</a>`;
            }
          }
          return '';
        }}
      ];

      apptTable = new DataTable('appts-table', columns, [], { searchInputId: 'appt-search', defaultSort: 'time' });
      loadAppointments();

      // Filters
      document.getElementById('filter-date').addEventListener('change', loadAppointments);
      document.getElementById('filter-upcoming').addEventListener('change', (e) => {
        document.getElementById('filter-date').disabled = e.target.checked;
        loadAppointments();
      });

      // Event Delegation
      document.getElementById('appts-table').addEventListener('click', async (e) => {
        const btn = e.target.closest('.btn-consult');
        if (btn) {
          btn.disabled = true;
          try {
            // Get or create consultation draft for this appointment, then redirect
            const consult = consultations.getOrCreateForAppointment(btn.dataset.id);
            window.location.href = `consultation.html?id=${consult.id}`;
          } catch (err) {
            Toast.show(err.message, 'error');
            btn.disabled = false;
          }
        }
      });
    });

    function loadAppointments() {
      const isUpcoming = document.getElementById('filter-upcoming').checked;
      const dateEl = document.getElementById('filter-date');
      let data = [];
      if (isUpcoming) {
        const todayStr = new Date().toISOString().split('T')[0];
        const nextWeek = new Date(Date.now() + 7 * 86400000).toISOString().split('T')[0];
        data = appointments.list({ doctorId: currentUser.staffId })
                           .filter(a => a.date >= todayStr && a.date <= nextWeek);
      } else {
        data = appointments.list({ date: dateEl.value, doctorId: currentUser.staffId });
      }
      apptTable.updateData(data);
    }
    
    // Auto-refresh when another tab books an appointment or reads notifications
    window.addEventListener('storage', (e) => {
      if (e.key === 'clinova.v1.appointments' || e.key === 'clinova.v1.notifications') {
        loadAppointments();
      }
    });
  </script>
</body>
</html>
